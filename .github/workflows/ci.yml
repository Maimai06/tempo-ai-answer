name: 测试与构建
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: 静态检查、竞态和覆盖率
        shell: bash
        env:
          TEMPO_BROWSER_TEST: '1'
        run: bash scripts/check.sh
      - name: 本机二进制启动验证
        shell: bash
        run: |
          go build -o artifacts/tempo-smoke.exe ./cmd/tempo-ai-answer
          artifacts/tempo-smoke.exe --version
          artifacts/tempo-smoke.exe check --local
  build:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: go run ./tools/build
      - uses: actions/upload-artifact@v4
        with:
          name: executables-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
