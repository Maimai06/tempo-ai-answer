<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="selection-key" content="__SELECTION_KEY__">
<title>Tempo AI 答题范围</title>
<style>
  :root {
    color-scheme: light;
    --page: #f3f5f2;
    --surface: #ffffff;
    --surface-muted: #eef1ed;
    --ink: #202a26;
    --muted: #65716a;
    --line: #d7ddd8;
    --line-soft: #e7ebe7;
    --accent: #216b55;
    --accent-strong: #174d3f;
    --accent-soft: #e8f1ec;
    --blue: #356b8a;
    --amber: #936112;
    --red: #a64038;
    font: 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    color: var(--ink);
    background: var(--page);
  }
  * { box-sizing: border-box; }
  body { min-width: 320px; min-height: 100vh; margin: 0; color: var(--ink); background: var(--page); }
  button,input { font: inherit; }
  button { min-height: 36px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); background: var(--surface); cursor: pointer; transition: background .16s,border-color .16s,color .16s; }
  button:hover:not(:disabled) { border-color: #9daaa1; background: var(--surface-muted); }
  button:disabled { cursor: not-allowed; opacity: .5; }
  button:focus-visible,input:focus-visible,a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .skip-link { position: fixed; z-index: 10; top: 6px; left: 8px; transform: translateY(-150%); padding: 8px 10px; color: #fff; background: #202a26; }
  .skip-link:focus { transform: translateY(0); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .topbar { position: sticky; top: 0; z-index: 3; min-height: 58px; display: flex; align-items: center; gap: 22px; padding: 7px max(22px,calc((100vw - 1600px)/2)); border-bottom: 1px solid #293831; color: #f5f7f4; background: #202a26; }
  .brand { min-width: 190px; display: flex; align-items: center; gap: 10px; color: #f5f7f4; font-size: 14px; font-weight: 650; }
  .brand-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 3px; color: #17241e; background: #a8d1b8; font-size: 11px; font-weight: 750; }
  .run-indicator { display: inline-flex; align-items: center; gap: 7px; color: #d2dbd4; font-size: 11px; white-space: nowrap; }
  .run-indicator i { width: 7px; height: 7px; border-radius: 50%; background: #a8d1b8; }
  .header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  #continue-run { border-color: #547764; color: #fff; background: #315743; }
  #exit-app { border-color: #74534b; color: #f3d6d0; background: #43302c; }
  [hidden] { display: none !important; }

  #workspace.workspace-layout { width: min(1600px,100%); height: calc(100vh - 128px); min-height: 540px; display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,.9fr); margin: 0 auto; padding: 0 22px 14px; }
  #scope-view.scope-layout { min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(0,1.12fr) minmax(245px,.88fr); grid-template-rows: minmax(0,1fr) auto; gap: 0; padding: 0 16px 0 0; }
  #scope-view .selection-column { min-width: 0; min-height: 0; display: grid; grid-template-rows: minmax(115px,.72fr) minmax(0,1.28fr); border-right: 1px solid var(--line); }
  #scope-view .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding-top: 16px; }
  #scope-view .classroom-rail { padding: 16px 12px 10px 0; border-bottom: 1px solid var(--line); }
  #scope-view .course-pane { padding: 12px 12px 0 0; }
  #scope-view .detail-rail { padding-left: 16px; }
  #scope-view .pane-title { display: flex; align-items: center; justify-content: flex-start; gap: 9px; padding: 0 0 10px; border: 0; border-bottom: 1px solid var(--line); }
  #scope-view .pane-title h1,#scope-view .pane-title h2 { margin: 0; color: var(--ink); font-size: 14px; font-weight: 650; }
  #scope-view .pane-title small { display: block; margin-top: 1px; color: var(--muted); font-size: 11px; }
  .step-no { width: 25px; height: 25px; flex: none; border: 1px solid #bcc7bf; border-radius: 3px; color: #355544; background: #f8faf8; font: 600 10px/23px ui-monospace,SFMono-Regular,Menlo,monospace; text-align: center; }
  .class-list,.course-list,.selected-list { min-height: 0; display: flex; flex-direction: column; gap: 0; padding: 7px 0 0; overflow: auto; }
  .class-list,.course-list { flex: 1; }
  .selected-list { flex: 1; }
  .choice-row { min-height: 42px; display: flex; align-items: center; gap: 9px; margin-right: 3px; padding: 7px 7px; border: 0; border-bottom: 1px solid var(--line-soft); border-left: 2px solid transparent; cursor: pointer; transition: background .14s,border-color .14s; }
  .choice-row:hover { background: #eef2ee; }
  .choice-row:has(input:checked),.choice-row:has(input:indeterminate) { border-left-color: var(--accent); background: var(--accent-soft); }
  .choice-row input { width: 16px; height: 16px; flex: none; margin: 0; accent-color: var(--accent); }
  .course-choice-row { cursor: default; }
  .course-choice-row:hover:not(:has(input:checked)):not(:has(input:indeterminate)) { background: transparent; }
  .course-check { width: 28px; height: 28px; display: grid; place-items: center; flex: none; cursor: pointer; }
  .course-open { min-width: 0; min-height: 0; display: flex; align-items: center; gap: 9px; flex: 1; padding: 0; border: 0; border-radius: 0; color: inherit; background: transparent; text-align: left; }
  .course-open:hover:not(:disabled) { border-color: transparent; background: transparent; }
  .course-open:hover:not(:disabled) .choice-name { text-decoration: underline; text-decoration-color: #8d9c91; text-underline-offset: 2px; }
  .course-open-hint { flex: none; color: var(--blue); font-size: 10px; white-space: nowrap; }
  .course-error { padding: 8px 0; color: var(--red); overflow-wrap: anywhere; }
  .choice-main { min-width: 0; flex: 1; }
  .choice-name { display: block; color: #283630; overflow-wrap: anywhere; }
  .choice-meta { display: block; margin-top: 1px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
  .course-toolbar { flex: none; }
  .search-field { display: block; margin: 10px 0 4px; }
  .search-field input { width: 100%; height: 35px; padding: 6px 9px; border: 1px solid #cbd3cd; border-radius: 3px; color: var(--ink); background: var(--surface); }
  .search-field input::placeholder { color: #7a857e; }
  .empty { padding: 16px 8px; color: #707c74; font-style: normal; }
  .course-group { margin: 0; padding: 10px 0 12px; border-bottom: 1px solid var(--line); }
  .course-group-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
  .course-group-head h3 { min-width: 0; flex: 1; margin: 0; color: #27342d; font-size: 12px; font-weight: 650; overflow-wrap: anywhere; }
  .course-group-head h3 small { display: block; margin-top: 1px; color: var(--muted); font-size: 10.5px; font-weight: 400; }
  .course-group-head button,.tools button { min-height: 28px; padding: 3px 5px; border: 0; border-radius: 0; color: var(--blue); background: transparent; font-size: 11px; text-align: right; }
  .course-group-head button:hover:not(:disabled),.tools button:hover:not(:disabled) { border-color: transparent; color: #234e66; background: #edf2f3; }
  .tools { display: flex; justify-content: flex-end; margin: 0 0 2px; }
  .step-list { display: flex; flex-direction: column; }
  .step-list .choice-row { min-height: 36px; padding: 5px 6px; }
  .step-list .choice-name { font-size: 11px; }
  .status { flex: none; margin-left: auto; padding-left: 4px; color: #296c50; font-size: 10px; white-space: nowrap; }
  .status.done { color: #737d76; }
  .mode-section { flex: none; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .mode-heading { padding: 0 0 5px; }
  .mode-heading h2 { margin: 0; color: var(--ink); font-size: 13px; font-weight: 650; }
  #scope-view .modebar { display: block; padding: 0; overflow: visible; border: 0; border-radius: 0; background: transparent; }
  #scope-view .mode-option { min-height: 48px; display: flex; align-items: flex-start; gap: 8px; margin: 0; padding: 7px 6px; border: 0; border-bottom: 1px solid var(--line-soft); border-left: 2px solid transparent; border-radius: 0; background: transparent; cursor: pointer; }
  #scope-view .mode-option:has(input:checked) { border-color: var(--line-soft); border-left-color: var(--accent); box-shadow: none; background: var(--accent-soft); }
  #scope-view .mode-option input { flex: none; margin: 2px 0 0; accent-color: var(--accent); }
  #scope-view .mode-option strong { display: block; color: #283630; font-size: 11.5px; }
  #scope-view .mode-option small { display: block; margin-top: 1px; color: var(--muted); font-size: 10.5px; line-height: 1.35; }
  #scope-view .message { grid-column: 1 / -1; min-height: 0; margin: 0; padding-top: 5px; color: #4c5a51; font-size: 12px; }
  #scope-view .message.error { color: var(--red); }
  #scope-view .message.ok { color: var(--accent-strong); }

  .footer { position: fixed; z-index: 2; right: 0; bottom: 0; left: 0; display: flex; justify-content: center; border-top: 1px solid #cbd3cc; background: #fbfcfa; }
  .footer-inner { width: min(1600px,100%); min-height: 70px; display: flex; align-items: center; gap: 13px; padding: 9px 22px; }
  #summary-count { color: #3d4a42; white-space: nowrap; }
  #summary-count strong { color: var(--accent-strong); font-variant-numeric: tabular-nums; }
  #status-line { min-width: 0; flex: 1; color: var(--muted); font-size: 12px; }
  #start,#confirm-start { min-width: 150px; border-color: var(--accent-strong); border-radius: 3px; color: #fff; background: var(--accent-strong); font-weight: 620; }
  #start:hover:not(:disabled),#confirm-start:hover:not(:disabled) { border-color: #103a30; background: #103a30; }
  #cancel { min-width: 74px; }
  dialog { width: min(620px,calc(100vw - 28px)); max-height: min(80vh,720px); padding: 0; border: 1px solid #aab6ad; border-radius: 4px; color: var(--ink); background: var(--surface); box-shadow: 0 18px 55px #18251e35; }
  dialog::backdrop { background: #18241e9c; }
  .dialog-head { padding: 15px 18px; border-bottom: 1px solid var(--line); }
  .dialog-head h2 { margin: 0; font-size: 15px; }
  .dialog-body { max-height: 55vh; overflow: auto; padding: 14px 18px; }
  .dialog-body p { margin: 4px 0 10px; }
  .dialog-body ul { margin: 6px 0; padding-left: 22px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 11px 18px; border-top: 1px solid var(--line); }

  #monitor-view.monitor-view { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto auto minmax(0,1fr) 126px; padding: 16px 0 0 18px; border-left: 1px solid var(--line); }
  #monitor-view .monitor-head { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 0 0 10px; border-bottom: 1px solid var(--line); }
  #monitor-view .monitor-head h2 { margin: 0; color: var(--ink); font-size: 14px; line-height: 1.35; font-weight: 650; }
  #monitor-view .monitor-head p:last-child { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
  .progress-wrap { width: min(220px,42%); min-width: 130px; display: flex; align-items: center; gap: 8px; }
  #monitor-view #progress { flex: 1; height: 5px; overflow: hidden; border-radius: 0; background: #dce3dd; }
  #monitor-view #progress > i { display: block; width: 0; height: 100%; background: var(--accent); transition: width .28s; }
  #monitor-view #c-index { min-width: 56px; color: #46554b; font: 12px ui-monospace,SFMono-Regular,Menlo,monospace; text-align: right; }
  #monitor-view .metrics { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  #monitor-view .metric { min-width: 0; }
  #monitor-view .metric-label { color: #737e76; font-size: 10px; }
  #monitor-view .metric-value { min-width: 0; display: block; margin-top: 2px; color: #27352e; font-size: 11.5px; font-weight: 620; overflow-wrap: anywhere; }
  #monitor-view .metric-value a { color: var(--blue); text-decoration: none; }
  #monitor-view .metric-value a:hover { text-decoration: underline; }
  #monitor-view .ai-state { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: #89958d; }
  .dot.asking { background: var(--amber); }
  .dot.answering { background: var(--accent); animation: pulse 1.1s infinite; }
  .dot.done { background: #3c7898; }
  .dot.error { background: #b4473e; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  #monitor-view .monitor-grid { min-height: 0; display: grid; grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(76px,.78fr) minmax(96px,1fr) minmax(76px,.82fr); grid-template-areas:"question" "answer" "result"; gap: 0; padding: 8px 0; border-bottom: 1px solid var(--line); }
  #monitor-view .monitor-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; border: 0; border-radius: 0; background: transparent; }
  #monitor-view .question-pane { grid-area: question; border-bottom: 1px solid var(--line-soft); }
  #monitor-view .answer-pane { grid-area: answer; border-bottom: 1px solid var(--line-soft); }
  #monitor-view .result-pane { grid-area: result; }
  #monitor-view .title { min-height: 28px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--line-soft); color: #334239; font-size: 11px; font-weight: 650; }
  #monitor-view .title span:last-child { color: #758078; font-weight: 400; }
  #monitor-view .body { min-height: 0; flex: 1; overflow: auto; padding: 8px 4px 9px 0; line-height: 1.65; }
  #monitor-view .body::-webkit-scrollbar { width: 7px; }
  #monitor-view .body::-webkit-scrollbar-thumb { border: 2px solid var(--page); border-radius: 4px; background: #bdc8c0; }
  #monitor-view .body h4 { margin: 9px 0 4px; padding-left: 7px; border-left: 2px solid var(--accent); color: #315546; font-size: 12px; }
  #monitor-view .body p,#monitor-view .body li { color: #45524a; font-size: 12px; }
  #monitor-view pre { margin: 7px 0; padding: 10px 11px; overflow: auto; border: 1px solid #26342d; border-radius: 2px; color: #e6eee8; background: #202a26; font: 11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  #monitor-view code { padding: 1px 4px; border-radius: 2px; color: #315c70; background: #e9eff0; font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  #monitor-view .ai-msg { color: #304139; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #monitor-view .pass { color: #216948; font-weight: 650; }
  #monitor-view .fail { color: var(--red); font-weight: 650; }
  #monitor-view .neutral { color: #58675e; font-weight: 650; }
  #monitor-view .result-box { margin: 8px 0; padding: 8px 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; }
  #monitor-view .result-box.pass { border-color: #9fc5ae; }
  #monitor-view .result-box.fail { border-color: #d9aaa4; }
  #monitor-view .result-box.neutral { border-color: var(--line); }
  #monitor-view .mono { margin-top: 4px; font: 11px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  #monitor-view .empty { padding: 8px 0; color: #7b867f; }
  #monitor-view .logs { min-height: 0; margin: 0; padding: 0 0 7px; overflow: auto; border: 0; border-radius: 0; color: #d5ded8; background: #202a26; }
  #monitor-view .logs-head { display: flex; justify-content: space-between; padding: 8px 0 5px; border-bottom: 1px solid #3b4740; color: #d9e1dc; font-size: 10px; font-weight: 600; }
  #monitor-view .logs-head a { color: #9bc6dc; text-decoration: none; }
  #monitor-view .logs-head a:hover { text-decoration: underline; }
  #monitor-view #logbox { max-height: 92px; overflow: auto; padding: 6px 0; font: 10.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  #monitor-view #logbox div { color: #b6c1b9; }
  #monitor-view #logbox div.ok { color: #82c89d; }
  #monitor-view #logbox div.err { color: #ed9a8d; }
  #monitor-view #logbox div.ai { color: #9ac9e3; }

  @media(max-width:1180px) {
    #workspace.workspace-layout { height: auto; min-height: 0; display: flex; flex-direction: column; padding: 0 22px 104px; }
    #scope-view.scope-layout { height: 560px; min-height: 560px; grid-template-columns: minmax(0,1.05fr) minmax(285px,.95fr); padding-right: 0; }
    #monitor-view.monitor-view { min-height: 680px; padding: 18px 0 0; border-top: 1px solid var(--line); border-left: 0; }
    #monitor-view .monitor-grid { grid-template-columns: repeat(2,minmax(0,1fr)); grid-template-rows: minmax(170px,.85fr) minmax(190px,1fr); grid-template-areas: "question answer" "result result"; column-gap: 18px; }
    #monitor-view .result-pane { border-top: 0; }
  }
  @media(max-width:760px) {
    .topbar { flex-wrap: wrap; gap: 7px 12px; padding: 8px 14px; }
    .brand { min-width: 0; flex: 1; }
    .run-indicator { order: 3; }
    .header-actions { max-width: 100%; flex-wrap: wrap; justify-content: flex-end; gap: 7px 10px; }
    .header-actions button { min-height: 40px; padding: 5px 8px; font-size: 11px; }
    #workspace.workspace-layout { padding: 0 14px 152px; }
    #scope-view.scope-layout { height: auto; min-height: 0; display: block; padding: 0; }
    #scope-view .selection-column { min-height: 0; display: flex; flex-direction: column; border: 0; }
    #scope-view .pane,#scope-view .classroom-rail,#scope-view .course-pane,#scope-view .detail-rail { min-height: 0; display: flex; padding: 14px 0; border: 0; border-bottom: 1px solid var(--line); }
    #scope-view .class-list { max-height: 210px; flex: none; }
    #scope-view .course-list { max-height: 42vh; min-height: 120px; flex: none; }
    #scope-view .selected-list { max-height: 340px; flex: none; }
    #scope-view .choice-row { min-height: 44px; }
    #scope-view .step-list .choice-row { min-height: 42px; }
    #scope-view .mode-section { width: 100%; margin-top: 12px; padding: 12px 0 0; border: 0; border-top: 1px solid var(--line); }
    #scope-view .message { min-height: 26px; padding-top: 6px; }
    .footer-inner { min-height: 82px; flex-wrap: wrap; gap: 7px 10px; padding: 8px 14px; }
    #summary-count { flex: 1; }
    #status-line { flex-basis: 100%; order: 3; font-size: 11px; }
    #start { min-width: 125px; }
    #monitor-view.monitor-view { min-height: 0; display: flex; flex-direction: column; padding: 18px 0 0; border-top: 1px solid var(--line); }
    #monitor-view .monitor-head { align-items: stretch; flex-direction: column; gap: 8px; }
    #monitor-view .monitor-head h2 { font-size: 14px; }
    .progress-wrap { width: 100%; min-width: 0; }
    #monitor-view .metrics { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px 12px; }
    #monitor-view .monitor-grid { display: grid; grid-template-columns: minmax(0,1fr); grid-template-rows: auto; grid-template-areas: "question" "answer" "result"; gap: 0; padding: 6px 0; }
    #monitor-view .question-pane,#monitor-view .answer-pane,#monitor-view .result-pane { min-height: 190px; padding: 8px 0; border: 0; border-bottom: 1px solid var(--line); }
    #monitor-view .logs { min-height: 160px; }
    #monitor-view #logbox { max-height: 128px; }
  }
  @media(max-width:420px) {
    .footer-inner { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
    #summary-count,#status-line { grid-column: 1 / -1; white-space: normal; }
    #cancel,#start { grid-row: 2; width: 100%; min-width: 0; }
  }
  @media(prefers-reduced-motion:reduce) {
    *,*::before,*::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#scope-view">跳到答题范围</a>
<header class="topbar">
  <div class="brand"><span class="brand-mark">TA</span><span>Tempo AI 助手</span></div>
  <div class="run-indicator"><i aria-hidden="true"></i><span id="task-state" aria-live="polite">待开始</span></div>
  <div class="header-actions"><button id="continue-run" type="button" hidden>继续选择范围</button><button id="exit-app" type="button" hidden>退出程序</button></div>
</header>
<main id="workspace" class="workspace-layout">
  <h1 class="sr-only">Tempo AI 答题工作区</h1>
  <section id="scope-view" class="scope-layout" aria-label="答题范围" tabindex="-1">
    <div class="selection-column">
      <aside class="pane classroom-rail" id="classroom-pane">
        <div class="pane-title"><span class="step-no">01</span><div><h2>课堂</h2><small id="classroom-count"></small></div></div>
        <div class="class-list" id="classrooms"><div class="empty">正在读取课堂列表…</div></div>
      </aside>
      <section class="pane course-pane" id="courses-pane">
        <div class="course-toolbar">
          <div class="pane-title"><span class="step-no">02</span><div><h2>实验</h2><small id="course-count"></small></div></div>
          <label class="search-field"><span class="sr-only">搜索实验</span><input id="course-search" type="search" placeholder="搜索实验名称或章节" aria-label="搜索实验名称或章节"></label>
        </div>
        <div class="course-list" id="courses"><div class="empty">请先选择课堂。</div></div>
      </section>
    </div>
    <aside class="pane detail-rail" id="steps-pane">
      <div class="pane-title"><span class="step-no">03</span><div><h2>关卡范围</h2><small id="step-count"></small></div></div>

</dialog>
<script>
const key = document.querySelector('meta[name="selection-key"]').content;
const data = { classrooms: [], classroomId: "", classroomLabel: "", classroomEpoch: 0, requestSerial: 0, courseEpoch: new Map(), courses: [], openCourses: new Set(), loadingCourses: new Set(), pendingSelectAll: new Set(), courseErrors: new Map(), steps: new Map(), selectedSteps: new Map(), busy: 0, courseAnchor: -1, stepAnchors: new Map(), started: false, runSummary: "" };
const el = id => document.getElementById(id);
const mode = () => document.querySelector('input[name="mode"]:checked').value;
const api = async (path, options = {}) => {
  const response = await fetch(path, { cache: "no-store", ...options, headers: { ...(options.headers || {}), ...(options.method === "POST" ? { "Content-Type": "application/json", "X-Selection-Key": key } : {}) } });
  if (!response.ok) {
    const text = await response.text();
    let message = text;
    try { message = JSON.parse(text).error || text; } catch (_) {}

  if (response.status === 202) return null;
  return response.json();
};
const make = (tag, className, text) => { const node = document.createElement(tag); if (className) node.className = className; if (text !== undefined) node.textContent = text; return node; };
function showMessage(text, kind = "") { const box = el("message"); box.textContent = text; box.className = "message" + (kind ? " " + kind : ""); }
function selectedFor(courseId) { if (!data.selectedSteps.has(courseId)) data.selectedSteps.set(courseId, new Set()); return data.selectedSteps.get(courseId); }
function courseById(id) { return data.courses.find(item => item.id === id); }
function stepById(courseId, id) { return (data.steps.get(courseId) || []).find(item => item.id === id); }
function updateCourseCheckbox(input, courseId) {
  const course = courseById(courseId);
  const label = [course?.number, course?.name || "未命名实验"].filter(Boolean).join(" ");
  const items = data.steps.get(courseId);
  if (!items) {
    input.checked = data.pendingSelectAll.has(courseId);
    input.indeterminate = false;
    input.disabled = data.loadingCourses.has(courseId);
    input.setAttribute("aria-label", `${label}，${input.checked ? "正在初始化实践环境并选择全部可选关卡" : "勾选后初始化实践环境并全选可选关卡"}`);
    return;
  }
  input.disabled = false;
  const available = items.filter(step => mode() === "trial" || !step.finished);
  const selected = available.filter(step => selectedFor(courseId).has(step.id)).length;
  input.checked = available.length > 0 && selected === available.length;
  input.indeterminate = selected > 0 && selected < available.length;
  const state = available.length ? `${selected}/${available.length} 个可选关卡已选` : "当前模式下没有可选择的关卡";

}
function syncCourseCheckbox(courseId) {

  if (input) updateCourseCheckbox(input, courseId);
}
function rangeRows(parent, event, kind, courseId = "") {
  const selector = kind === "course" ? ".course-choice-row" : "label.choice-row";
  const rows = [...parent.querySelectorAll(selector)];
  const row = event.target.closest(selector);
  if (!row) return;
  const target = row.querySelector("input");
  if (kind === "course" && event.target !== target) return;
  const index = rows.indexOf(row);
  const anchorKey = courseId || kind;
  const anchor = kind === "course" ? data.courseAnchor : data.stepAnchors.get(anchorKey);
  const checked = event.target === target ? target.checked : !target.checked;
  if (event.shiftKey && anchor !== undefined && anchor >= 0 && anchor < rows.length) {
    for (let i = Math.min(anchor,index); i <= Math.max(anchor,index); i++) {
      const input = rows[i].querySelector("input");
      if (input === target || input.disabled || input.checked === checked) continue;
      input.checked = checked;
      input.dispatchEvent(new Event("change", { bubbles: true }));
    }
  }
  if (kind === "course") data.courseAnchor = index;
  else data.stepAnchors.set(anchorKey, index);
}
function renderClassrooms() {
  const target = el("classrooms"); target.replaceChildren();
  el("classroom-count").textContent = `${data.classrooms.length} 个`;
  if (!data.classrooms.length) { target.append(make("div","empty","当前没有进行中的课堂。")); return; }
  for (const item of data.classrooms) {
    const label = make("label","choice-row");
    const input = document.createElement("input"); input.type = "radio"; input.name = "classroom"; input.value = item.id; input.checked = item.id === data.classroomId;
    input.addEventListener("change", () => selectClassroom(item.id));
    const main = make("span","choice-main"); main.append(make("span","choice-name",item.classroomName || "未命名课堂"),make("span","choice-meta",item.belongToClass || ""));
    label.append(input,main); target.append(label);
  }
}
async function selectClassroom(id) {
  data.classroomId = id; data.classroomEpoch++; data.courseEpoch.clear(); data.courses = []; data.openCourses.clear(); data.loadingCourses.clear(); data.pendingSelectAll.clear(); data.courseErrors.clear(); data.steps.clear(); data.selectedSteps.clear();
  const epoch = data.classroomEpoch;
  renderClassrooms(); renderCourses(); renderSelected(); updateSummary(); showMessage("正在读取该课堂的实验清单…");
  try { const courses = await api(`/api/select/courses?classroom_id=${encodeURIComponent(id)}`); if (epoch !== data.classroomEpoch) return; data.courses = courses; renderCourses(); showMessage("实验清单已加载。", "ok"); }
  catch (error) { if (epoch === data.classroomEpoch) showMessage(`读取实验失败：${error.message}`,"error"); }
  updateSummary();
}
function renderCourses() {
  const target = el("courses"); target.replaceChildren();
  el("course-count").textContent = data.classroomId ? `${data.courses.length} 个` : "";
  if (!data.classroomId) { target.append(make("div","empty","请先选择课堂。")); return; }
  const query = el("course-search").value.trim().toLocaleLowerCase();
  const filtered = data.courses.filter(item => `${item.number} ${item.chapter} ${item.name}`.toLocaleLowerCase().includes(query));
  if (!filtered.length) { target.append(make("div","empty",query ? "没有匹配的实验。" : "该课堂没有可选实验。")); return; }
  for (const item of filtered) {
    const row = make("div","choice-row course-choice-row");
    const input = document.createElement("input"); input.type = "checkbox"; input.dataset.courseId = item.id; updateCourseCheckbox(input,item.id);
    input.addEventListener("change", () => {
      data.openCourses.add(item.id);
      if (data.steps.has(item.id)) setCourseSelection(item.id,input.checked);
      else if (input.checked) loadCourseSteps(item.id,{ selectAll:true });
      renderCourses(); renderSelected(); updateSummary();
    });
    const main = make("span","choice-main"); main.append(make("span","choice-name",item.name || "未命名实验"),make("span","choice-meta",`${item.chapter || "未分章"} · ${item.number || ""}`));
    const open = make("button","course-open"); open.type = "button"; open.setAttribute("aria-expanded",String(data.openCourses.has(item.id)));
    open.setAttribute("aria-label",`${data.loadingCourses.has(item.id) ? "正在读取" : "查看"}${item.name || "未命名实验"}的关卡`);
    open.disabled = data.loadingCourses.has(item.id);
    open.addEventListener("click",() => loadCourseSteps(item.id));
    const hint = make("span","course-open-hint",data.loadingCourses.has(item.id) ? "读取中…" : data.courseErrors.has(item.id) ? "重试读取" : data.steps.has(item.id) ? "已加载" : "查看关卡");
    open.append(main,hint);
    const checkboxLabel = make("label","course-check"); checkboxLabel.append(input);
    row.append(checkboxLabel,open); target.append(row);
  }
}
function setCourseSelection(id, checked) {
  data.openCourses.add(id);
  const items = data.steps.get(id);
  const selected = selectedFor(id);
  selected.clear();
  if (checked) for (const step of items || []) if (mode() === "trial" || !step.finished) selected.add(step.id);
}
async function loadCourseSteps(id, { selectAll = false } = {}) {
  data.openCourses.add(id);
  if (data.steps.has(id)) {
    if (selectAll) setCourseSelection(id,true);
    renderCourses(); renderSelected(); updateSummary();
    return;
  }
  if (data.loadingCourses.has(id)) {
    if (selectAll) data.pendingSelectAll.add(id);
    renderCourses(); renderSelected(); updateSummary();
    return;
  }
  const epoch = data.classroomEpoch;
  const courseEpoch = ++data.requestSerial;
  data.courseEpoch.set(id,courseEpoch);
  data.loadingCourses.add(id);
  data.courseErrors.delete(id);
  if (selectAll) data.pendingSelectAll.add(id);
  data.busy++; renderCourses(); renderSelected(); updateSummary();
  const courseName = courseById(id)?.name || "该实验";
  showMessage(`正在初始化「${courseName}」的实践环境并读取关卡；课程状态可能变为学习中。`);
  try {
    const items = await api(`/api/select/steps?classroom_id=${encodeURIComponent(data.classroomId)}&course_id=${encodeURIComponent(id)}`);
    if (epoch !== data.classroomEpoch || data.courseEpoch.get(id) !== courseEpoch) return;
    data.steps.set(id,items);
    if (data.pendingSelectAll.delete(id)) setCourseSelection(id,true);
    showMessage(`${courseName}：已读取 ${items.length} 个实际关卡。勾选实验前方的复选框可选择全部可选关卡；平台会在环境 HTTP 连接断开后自动关闭环境。`, "ok");
  } catch (error) {
    if (epoch !== data.classroomEpoch || data.courseEpoch.get(id) !== courseEpoch) return;
    data.pendingSelectAll.delete(id); data.courseErrors.set(id,error.message);
    showMessage(`「${courseName}」初始化或读取关卡失败：${error.message}。点击实验名称或复选框可重试。`,"error");
  } finally {
    data.busy--;
    if (data.courseEpoch.get(id) === courseEpoch) data.loadingCourses.delete(id);
    renderCourses(); renderSelected(); updateSummary();
  }
}
function renderSelected() {
  const target = el("selected-courses"); target.replaceChildren();
  const courses = data.courses.filter(course => data.openCourses.has(course.id));
  if (!courses.length) { target.append(make("div","empty","点击实验名称查看关卡；勾选前方复选框可选择该实验的全部可选关卡。")); el("step-count").textContent = ""; return; }
  let all = 0, picked = 0;
  for (const course of courses) {
    const id = course.id;
    const group = make("section","course-group");
    const head = make("div","course-group-head");
    const title = make("h3", "", course.name || "未命名实验"); title.append(make("small","",`${course.chapter || "未分章"} · ${course.number || ""}`));
    const clear = make("button","","清空勾选"); clear.type = "button"; clear.disabled = selectedFor(id).size === 0; clear.addEventListener("click",() => { selectedFor(id).clear(); syncCourseCheckbox(id); renderSelected(); updateSummary(); });
    head.append(title,clear); group.append(head);
    const items = data.steps.get(id);
    if (!items) {
      const error = data.courseErrors.get(id);
      if (error) {
        group.append(make("div","course-error",`读取失败：${error}`));
        const retry = make("button","","重试读取关卡"); retry.type = "button"; retry.addEventListener("click",() => loadCourseSteps(id)); group.append(retry);
      } else group.append(make("div","empty",data.loadingCourses.has(id) ? "正在准备实践环境并读取关卡…" : "等待读取关卡清单…"));
      target.append(group); continue;
    }
    if (!items.length) { group.append(make("div","empty","平台返回的关卡清单为空。")); target.append(group); continue; }
    all += items.filter(step => mode() === "trial" || !step.finished).length;
    const tools = make("div","tools");
    const unfinished = make("button","","选择本实验未完成关卡"); unfinished.type = "button"; unfinished.addEventListener("click",() => { for (const step of items) if (!step.finished) selectedFor(id).add(step.id); syncCourseCheckbox(id); renderSelected(); updateSummary(); });
    tools.append(unfinished); group.append(tools);
    const list = make("div","step-list"); list.dataset.courseId = id;
    for (const step of items) {
      const label = make("label","choice-row");
      const skipped = mode() !== "trial" && step.finished;
      const input = document.createElement("input"); input.type = "checkbox"; input.checked = selectedFor(id).has(step.id) && !skipped; input.dataset.stepId = step.id;
      input.disabled = skipped;
      input.addEventListener("change",() => { if (input.checked) selectedFor(id).add(step.id); else selectedFor(id).delete(step.id); syncCourseCheckbox(id); updateSummary(); });
      const main = make("span","choice-main"); main.append(make("span","choice-name",`第 ${step.sequence} 关 · ${step.name || "未命名关卡"}`));
      const status = make("span",`status${step.finished ? " done" : ""}`,step.finished ? (skipped ? "已完成 · 将跳过" : "已完成") : "未完成");
      label.append(input,main,status); list.append(label);
      if (!skipped && input.checked) picked++;

    group.append(list); target.append(group);
  }

}
function effectiveSelection() {
  const courses = [];
  let steps = 0, passed = 0;
  for (const { id: courseId } of data.courses) {
    const selected = selectedFor(courseId), available = data.steps.get(courseId) || [], stepIds = [];

}
function updateSummary() {

  else if (mode() === "trial" && selection.steps !== 1) el("status-line").textContent = "单关试运行需要且只能选择一个关卡。";
  else if (selection.passed) el("status-line").textContent = `${selection.passed} 个已完成关卡会跳过；确认范围后才会启动。`;
  else if (ready) el("status-line").textContent = "关卡范围已就绪；确认后才会启动 AI 请求或评测。";
  else el("status-line").textContent = data.busy ? "正在准备实践环境并读取关卡…" : "选择课堂、实验和关卡后即可确认。";
  el("step-count").textContent = `${selection.steps} 个已选`;
}
function showConfirmation() {
  const selection = effectiveSelection();
  const body = el("confirm-body"); body.replaceChildren();

  const labels = { formal:"正式答题 · 提交答案并评测", trial:"单关试运行 · 真实 AI，不提交答案或评测", demo:"流程演示 · 模拟 AI，不提交答案或评测" };
  body.append(make("p","",`课堂：${classroom?.classroomName || ""} ${classroom?.belongToClass || ""}`),make("p","",`方式：${labels[mode()]}`));

  for (const chosen of selection.courses) {

}
function payload() {

}
el("course-search").addEventListener("input",renderCourses);
el("courses").addEventListener("click",event => rangeRows(el("courses"),event,"course"));

el("confirm-start").addEventListener("click",async () => {
  const button = el("confirm-start"); button.disabled = true; button.textContent = "正在确认…";
  try {
    const selected = effectiveSelection();
    const classroom = data.classrooms.find(item => item.id === data.classroomId);
    data.classroomLabel = `${classroom?.classroomName || ""} ${classroom?.belongToClass || ""}`.trim() || "当前课堂";
    data.runSummary = `${data.classroomLabel} · ${selected.courses.length} 个实验 · ${selected.steps} 个关卡`;

    document.querySelectorAll("#scope-view input, #scope-view button").forEach(control => { control.disabled = true; });
    el("task-state").textContent = "运行中";
    el("status-line").textContent = "范围已确认并锁定；运行状态持续显示在右侧。";
    setSelectionLocked(true);
    tick();
  }
  catch (error) { el("confirm-dialog").close(); showMessage(`无法开始：${error.message}`,"error"); }
  finally { button.disabled = false; button.textContent = "确认开始"; }
});
el("continue-run").addEventListener("click",async () => {
  const button = el("continue-run"); button.disabled = true; button.textContent = "正在返回选择…";
  try {
    await api("/api/select/continue",{ method:"POST", body:"{}" });
    data.started = false; data.runSummary = ""; data.classroomId = ""; data.classroomLabel = "";
    data.classroomEpoch++; data.courseEpoch.clear(); data.classrooms = []; data.courses = []; data.openCourses.clear(); data.loadingCourses.clear(); data.pendingSelectAll.clear(); data.courseErrors.clear(); data.steps.clear(); data.selectedSteps.clear(); data.busy = 0;
    data.courseAnchor = -1; data.stepAnchors.clear();
    el("course-search").value = "";

    el("run-title").textContent = "运行监控";
    el("run-subtitle").textContent = "等待任务开始";
    el("task-state").textContent = "待开始";
    el("continue-run").hidden = true; el("exit-app").hidden = true;
    setSelectionLocked(false);
    renderClassrooms(); renderCourses(); renderSelected(); updateSummary();
    await loadClassrooms();
  } catch (error) { showMessage(`无法继续选择：${error.message}`,"error"); }
  finally { button.disabled = false; button.textContent = "继续选择范围"; }
});
el("exit-app").addEventListener("click",async () => {
  const button = el("exit-app"); button.disabled = true; button.textContent = "正在清理…";
  try { await api("/api/select/close",{ method:"POST", body:"{}" }); button.textContent = "正在退出"; }
  catch (error) { button.disabled = false; button.textContent = "退出程序"; showMessage(`退出失败：${error.message}`,"error"); }
});
el("cancel").addEventListener("click",async () => {
  el("cancel").disabled = true;
  try { await api("/api/select/cancel",{ method:"POST", body:"{}" }); el("status-line").textContent = "已取消，可关闭此标签页。"; el("start").disabled = true; }
  catch (error) { showMessage(`取消失败：${error.message}`,"error"); el("cancel").disabled = false; }
});
async function loadClassrooms() {
  try {
    data.classrooms = await api("/api/select/classrooms"); renderClassrooms();
    if (data.classrooms.length === 1) await selectClassroom(data.classrooms[0].id);
    else if (!data.classrooms.length) showMessage("当前账号没有进行中的课堂。","error");
  } catch (error) { showMessage(`读取课堂失败：${error.message}`,"error"); }
  updateSummary();
}
async function init() { await loadClassrooms(); }
function setSelectionLocked(locked) {
  el("selection-footer").hidden = locked;
}

const monitorLast = {};
function monitorSetIfChanged(id,key,html) {
  if (monitorLast[key] === html) return;
  monitorLast[key] = html;
  el(id).innerHTML = html;
}
function monitorEscape(value) {
  return String(value || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function monitorMarkdown(value) {
  let output = monitorEscape(value);
  output = output.replace(/```[a-zA-Z]*\n([\s\S]*?)```/g,(match,code) => "<pre>" + code.replace(/\n+$/,"") + "</pre>");
  output = output.replace(/!\[[^\]]*\]\([^)]*\)(\{\{[^}]*\}\})?/g,"");
  output = output.replace(/^#{1,6}\s+(.+)$/gm,"<h4>$1</h4>");
  output = output.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  output = output.replace(/`([^`]+)`/g,"<code>$1</code>");
  output = output.replace(/^\s*[-*]\s+(.+)$/gm,"<li>$1</li>");
  output = output.replace(/^&gt;\s?(.*)$/gm,"<p class='muted'>$1</p>");
  output = output.replace(/\n{2,}/g,"</p><p>");
  return "<p>" + output + "</p>";
}
function renderMonitor(state) {
  el("c-acc").textContent = state.account || "-";
  el("c-course").textContent = state.course || "-";
  el("c-step").textContent = state.step_no ? `第 ${state.step_no} 关 · ${state.step_name || ""}` : "-";
  el("c-round").textContent = state.chat_round || "-";
  el("c-index").textContent = `${state.index || 0} / ${state.total || 0}`;
  const selectedClassroom = data.classrooms.find(item => item.id === data.classroomId);
  const classroomLabel = data.classroomLabel || `${selectedClassroom?.classroomName || ""} ${selectedClassroom?.belongToClass || ""}`.trim();
  el("c-classroom").textContent = classroomLabel || "-";
  const progress = state.total ? Math.min(100,(state.index / state.total) * 100) : 0;
  el("progress").firstElementChild.style.width = progress + "%";
  el("progress").setAttribute("aria-valuenow",String(Math.round(progress)));

  const statuses = { idle:["","空闲"], asking:["asking","等待 AI 回复"], answering:["answering","AI 正在输出"], done:["done","本关已完成"], finished:["done","任务已结束"], error:["error","运行异常"] };
  const [statusClass,statusText] = statuses[state.ai_status] || ["",state.ai_status || "空闲"];
  el("c-ai").replaceChildren(Object.assign(document.createElement("i"),{className:`dot ${statusClass}`}),document.createElement("span"));
  el("c-ai").lastElementChild.textContent = statusText;
  const seconds = data.started ? Math.max(0,Math.floor(Date.now()/1000 - (state.started_at || Date.now()/1000))) : 0;
  el("c-clock").textContent = data.started ? String(Math.floor(seconds/60)).padStart(2,"0") + ":" + String(seconds%60).padStart(2,"0") : "--:--";
  el("t-qtype").textContent = state.qtype || "";
  monitorSetIfChanged("p-desc","desc",state.desc ? monitorMarkdown(state.desc) : '<span class="empty">等待开始…</span>');

  let answer = '<span class="empty">等待提问…</span>';
  if (state.ai_answer) {
    answer = '<div class="ai-msg">' + monitorMarkdown(state.ai_answer) + "</div>";
    const body = el("p-ai");
    if (monitorLast.answerLength !== state.ai_answer.length) {
      monitorLast.answerLength = state.ai_answer.length;
      setTimeout(() => { body.scrollTop = body.scrollHeight; },10);
    }
  } else if (state.ai_status === "asking") answer = '<span class="empty">题目已发送，等待 AI 返回内容…</span>';
  else if (state.ai_status === "error") answer = '<span class="fail">' + monitorEscape(state.eval_detail || "AI 调用失败") + "</span>";
  monitorSetIfChanged("p-ai","answer",answer);
  el("t-len").textContent = state.prompt_len ? `prompt ${state.prompt_len} 字` : "";

  let result = state.final_code ? "<pre>" + monitorEscape(state.final_code) + "</pre>" : "";
  if (state.eval_detail) {
    const resultClass = state.eval_passed === true ? "pass" : state.eval_passed === false ? "fail" : "neutral";
    const resultTitle = state.eval_passed === true ? "评测通过" : state.eval_passed === false ? "评测未通过" : "未提交评测";
    result += `<div class="result-box ${resultClass}"><div class="${resultClass}">${resultTitle}</div><div class="mono">${monitorEscape(state.eval_detail)}</div></div>`;
  }
  monitorSetIfChanged("p-code","result",result || '<span class="empty">暂无代码或评测结果</span>');
  el("t-attempt").textContent = state.attempt ? `第 ${state.attempt} 次作答` : "";
  const link = el("c-open");
  if (state.practice_url) { link.href = state.practice_url; link.hidden = false; } else { link.hidden = true; }
  const logs = (state.logs || []).slice(-80).map(item => `<div class="${monitorEscape(item.kind)}">${monitorEscape(item.t)}  ${monitorEscape(item.text)}</div>`).join("");
  if (monitorLast.logs !== logs) { monitorLast.logs = logs; el("logbox").innerHTML = logs; el("logbox").scrollTop = el("logbox").scrollHeight; }

  if (state.ai_status === "finished") {
    el("run-title").textContent = "本次范围已完成";
    el("task-state").textContent = "本段完成";
    el("continue-run").hidden = false;
    el("exit-app").hidden = false;
    el("run-subtitle").textContent = data.runSummary;
    return;
  }
  el("continue-run").hidden = true;
  el("exit-app").hidden = true;
  if (state.ai_status === "error") el("run-title").textContent = "任务运行异常";
  else if (data.started && state.total) el("run-title").textContent = "正在处理答题范围";
  else if (data.started) el("run-title").textContent = "任务已启动";
  el("run-subtitle").textContent = data.runSummary || "等待任务开始";
  if (state.ai_status === "error") el("task-state").textContent = "有异常";
}
async function tick() {
  try {
    const response = await fetch("/state",{cache:"no-store"});
    if (response.ok) renderMonitor(await response.json());
  } catch (_) {}
}
setInterval(tick,700);
init();
</script>
</body>
</html>
